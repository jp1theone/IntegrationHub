name: Deploy API to Azure App Service

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy to confirm publishing the API to the configured App Service
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore IntegrationHub.sln
      - run: dotnet publish src/IntegrationHub.Api/IntegrationHub.Api.csproj --configuration Release --no-restore --output ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: integrationhub-api
          path: ./publish
      - name: Verify Azure deployment configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || (echo "Set the AZURE_WEBAPP_NAME repository variable." && exit 1)
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || (echo "Set the AZURE_WEBAPP_PUBLISH_PROFILE repository secret." && exit 1)
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
